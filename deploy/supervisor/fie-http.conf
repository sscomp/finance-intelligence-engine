; FIE HTTP runtime — Supervisor program template (Phase 6.9B-R2).
;
; REPOSITORY ARTIFACT (portable template). Deployment staging
; (deploy/scripts/fie-stage) substitutes the {{PLACEHOLDER}} tokens and
; emits the STAGED RUNTIME ARTIFACT; only the staged file is ever placed
; into an ACTIVE SUPERVISOR CONFIGURATION include directory. This file:
;   * contains NO secrets (credentials live in the operator-owned 0600
;     env file referenced by FIE_ENV_FILE — Phase 6.9B-R2 §9);
;   * contains NO host-specific absolute paths (all install-specific
;     paths are staged substitutions);
;   * launches ONLY the canonical entrypoint
;     `python -m phase3.transport.http` (6.9B-R1) — no second runtime.
;
; Lifecycle contract (rationale for every non-default value — WO §7):
;   autostart=true        deterministic boot activation (documented; a
;                         test fixture overrides autostart=false).
;   autorestart=unexpected: restart ONLY on unexpected termination.
;                         Graceful operator stop exits 0; config
;                         refusals exit 2 (ADR-017 fail-closed). Both
;                         are DECLARED EXPECTED (exitcodes below) so a
;                         bad config is NEVER crash-looped — it fails
;                         closed, visibly, once.
;   exitcodes=0,2         0 = clean SIGTERM shutdown; 2 = fail-closed
;                         startup refusal / bind conflict (sanitized
;                         single-line JSON diagnostic on stderr).
;   startsecs=5           the runtime validates config, then binds in
;                         well under a second; 5s proves stability.
;   startretries=3        bounded transient-failure tolerance.
;   stopsignal=TERM       application installs a SIGTERM handler;
;                         shutdown must be graceful, not SIGKILL.
;   stopwaitsecs=30       bounded graceful-shutdown interval (stop
;                         accepting connections -> close socket -> close
;                         runtime; far under 30s on this service).
;   stopasgroup=true      Python child threads (persistence worker,
;                         dispatch executor) get the signal too.
;   killasgroup=true      no detached child survives the supervisor.
;   redirect_stderr=true  one unified log stream (single log contract §10).
;
[program:fie-http]
command={{FIE_INSTALL_ROOT}}/deploy/scripts/fie-start
directory={{FIE_INSTALL_ROOT}}
user={{FIE_RUNTIME_USER}}
environment=PYTHONUNBUFFERED="1",FIE_ENV_FILE="{{FIE_ENV_FILE}}"
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
exitcodes=0,2
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile={{FIE_LOG_DIR}}/fie-http.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

; Health/readiness (validated before activation — deploy/README.md §5):
;   GET /healthz — public, unauthenticated liveness (ADR-018);
;   GET /readyz  — authenticated readiness (persistence reachable,
;                  fail-closed schema gate).