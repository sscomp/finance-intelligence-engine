# =============================================================================
# Telegram Publisher — Phase 2A 草稿
# =============================================================================
# 狀態：DRAFT / 非執行階段（NOT LOADED BY PRODUCTION）
# 用途：Phase 2B 派送設定對齊用
# 對應章節：ARCHITECTURE_REVIEW_PHASE2.md §7.5
#
# ⚠️ IMPORTANT ⚠️
# - 本檔案目前沒有任何 production runtime 載入它
# - 4 個 cron job 仍走「stdout → cron agent → telegram」凍結路徑
# - 變更本檔不會改任何派送行為
# - Phase 2A 任務是「把派送參數先結構化」，Phase 2C 才接 dispatcher
#
# ⚠️ 隱私（Phase 6.1 Workstream F）⚠️
# - 送到 Telegram 的個人 chat_id 是個人資料，一律以環境變數注入，
#   不得寫進任何被 git 追蹤的檔案（2026-10 起本檔僅留佔位符）：
#       FIE_TELEGRAM_CHAT_ID            主要收件人
#       FIE_TELEGRAM_SECONDARY_CHAT_ID  副本收件人（月報等）
# - 本機實際值請放在未被追蹤的覆寫檔（見 .gitignore）：
#       cp config/publishers/telegram.yaml config/publishers/telegram.local.yaml
#       # 在 .local.yaml 填入實際 chat_id，並維持舊版欄位形狀
# =============================================================================

# 主要派送通道
default:
  channel: telegram
  transport: stdout_to_cron_agent
  target_chat_id: "${FIE_TELEGRAM_CHAT_ID}"
  target_chat_id_int: null            # 由 FIE_TELEGRAM_CHAT_ID 注入；不落盤
  note: "目前 = print(stdout) → Hermes cron agent 抓 stdout → 送 telegram"

# 訊息長度限制（Telegram 官方 4096）
message_limits:
  max_length: 4096
  split_strategy: cron_agent_owns
  note: "Phase 2A：超過 4096 由 cron agent 自行 split，dispatcher 不接管"

# 多通道派送（Phase 2C 之後設計）
multi_channel:
  enabled: false                       # Phase 2A: 關閉
  secondary_targets:
    - chat_id: "${FIE_TELEGRAM_SECONDARY_CHAT_ID}"
      condition: "report_type in [company_monthly]"
      note: "月報副本收件人；行為由 cron job prompt 控制（既有凍結行為）"

# Footer（Phase 2C prompt v2.0.0 之後由 dispatcher 自動加）
footer:
  enabled: false                       # Phase 2A: 關閉
  format: |
    📋 task_id: {task_id}
    🤖 generated by: {plugin_name} v{plugin_version}
    🕐 data_freshness: {data_freshness_days} day(s)
  rationale: "Phase 2A 不加 footer，保留 4 個 cron 行為完全等價"

# Retry（凍結，純設計）
retry:
  enabled: false
  max_attempts: 0
  note: "派送 retry 凍結，失敗交給 cron agent 與 Hermes 本身"

# 失敗通知
failure_notification:
  enabled: true
  target_chat_id: "${FIE_TELEGRAM_CHAT_ID}"
  format: |
    ⚠️ 報告派送失敗
    report_type: {report_type}
    cron_job_id: {cron_job_id}
    error: {error_message}
  note: "失敗通知由 cron agent 負責（既有行為）"

# 觀測（給 dispatcher 寫 metrics 用）
observability:
  record_send_attempt: false           # Phase 2A 不開
  record_send_success: false
  record_send_duration: false
  note: "Phase 2B 開 L2 metrics"
